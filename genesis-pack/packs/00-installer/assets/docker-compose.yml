version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --check=false
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "9092:9092"
      - "8082:8082"

  redpanda-connect:
    image: redpandadata/connect:latest
    depends_on:
      - redpanda
    command: [ "run", "/connect/config/default.yaml" ]
    volumes:
      - ../../../packs/02-sensors/inputs:/connect/inputs:ro
      - ../../../data:/data
    ports:
      - "8880:8880"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    volumes:
      - ../../08-observability-evals/assets/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

