receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512
  attributes:
    actions:
      - key: service.namespace
        action: upsert
        value: genesis-pack

exporters:
  logging:
    verbosity: basic
  otlp/phoenix:
    endpoint: localhost:6006
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes, batch]
      exporters: [logging, otlp/phoenix]
