[project]
name = "genesis-pack"
version = "0.1.0"
description = "Genesis-Pack hardened operator stack"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2.2",
  "lancedb>=0.24.3",
  "kuzu>=0.8.2",
  "httpx>=0.28.1",
  "pydantic>=2.11.3",
  "python-ulid>=3.0.0",
  "pyyaml>=6.0.2",
  "opentelemetry-api>=1.32.1",
  "opentelemetry-sdk>=1.32.1",
  "opentelemetry-exporter-otlp>=1.32.1",
  "python-frontmatter>=1.1.0",
  "polars>=1.29.0",
  "pandas>=2.2.3",
  "selectolax>=0.3.29",
  "beautifulsoup4>=4.13.4",
  "pypdf>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.5",
  "pyright>=1.1.400",
  "bandit>=1.8.3",
  "semgrep>=1.118.0",
  "pytest>=8.3.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "basic"
include = ["packs", "skills", "assets"]
venvPath = "."
venv = ".venv"

